[workspace]

[package]
name = "socstat-verify"
version = "0.1.0"
edition = "2021"
description = "Host-side integration verification of the socstat SDK (full-module demo + integration tests)"

[dependencies]
socstat = { path = "../../socstat", features = ["full"] }
serde_json = "1.0"

[[example]]
name = "host_demo"
path = "examples/host_demo.rs"

[profile.dev]
# keep it fast to rebuild in verification loops